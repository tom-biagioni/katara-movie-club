name: Refresh streaming providers

on:
  schedule:
    - cron: "17 9 1 * *"   # 1st of each month, 09:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch availability from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python fetch_providers.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet providers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add providers.json
            git commit -m "Refresh streaming availability"
            git push
          else
            echo "No changes."
          fi
